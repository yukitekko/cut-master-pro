workflows:
  ios-build:
    name: iOSアプリのビルド
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: 必要な道具の準備
        script: npm install
      - name: Webアプリのデータ作成
        script: npm run build
      - name: iOS環境の有無を確認して強制生成
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          ls -la ios/App
      - name: iOSアプリの完成品を作る
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO